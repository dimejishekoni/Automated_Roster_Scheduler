name: Build Windows Exe

on:
  push:
    branches: ["project_branch"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install pyinstaller openpyxl pdfplumber pandas

    - name: Build with PyInstaller
      run: |
        # Make sure your script name matches here!
        pyinstaller --onefile --name roster_builder Roster_Builder/app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: roster_tool_exe
        path: dist/roster_builder.exe
